[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "morgan-media-downloader"
version = "0.1.0"
description = "A privacy-conscious macOS media downloader GUI"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.7,<7",
  "Pillow>=11,<13",
  "yt-dlp[default]>=2025.5.22",
]

[project.scripts]
morgan-media-downloader = "morgan_media_downloader.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
