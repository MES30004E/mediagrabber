name: Migration validation

on:
  push:
    branches: [main, migration/swift-design]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migration-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Linux media tools and Python wheels
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          python -m pip install --only-binary=:all: -r requirements.txt
          python -m pip check
          mkdir -p resources/bin
          for binary in ffmpeg ffprobe; do
            tool_path=$(command -v "$binary")
            ln -s "$tool_path" "resources/bin/$binary"
            "resources/bin/$binary" -version
          done
      - name: Full deterministic Python suite
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          test_root=$(mktemp -d "$RUNNER_TEMP/morgan-tests.XXXXXX")
          export MORGAN_DATA_DIR="$test_root/data"
          export MORGAN_LOG_DIR="$test_root/logs"
          export MORGAN_CACHE_DIR="$test_root/cache"
          python -m pytest -p no:cacheprovider

  swift-tests:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - name: Determine whether native source exists
        id: native
        shell: bash
        run: |
          set -euo pipefail
          native_files=$(git ls-files '*.swift')
          if [ -z "$native_files" ]; then
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo '::notice::No tracked Swift source yet; native build/tests were not run.'
            echo 'Native build/tests: not run (no Swift source).' >> "$GITHUB_STEP_SUMMARY"
          else
            test -f swift/Package.swift || {
              echo '::error::Swift source exists but swift/Package.swift is missing.'
              exit 1
            }
            echo 'present=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Record hosted native toolchain
        shell: bash
        run: swift --version
      - name: Swift build
        if: steps.native.outputs.present == 'true'
        working-directory: swift
        run: swift build
      - name: Swift tests
        if: steps.native.outputs.present == 'true'
        working-directory: swift
        run: swift test
