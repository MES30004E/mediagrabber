name: Migration validation

on:
  push:
    branches: [main, migration/swift-design, migration/backend-protocol, migration/swift-bridge, improvement/download-reliability]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migration-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Linux media, headless Qt libraries and Python wheels
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          # Offscreen Qt still links EGL/OpenGL; wheel installation does not
          # provide these system shared libraries. Keep all UI tests enabled.
          sudo apt-get install --yes --no-install-recommends ffmpeg libegl1 libopengl0
          python -m pip install --only-binary=:all: -r requirements.txt
          python -m pip check
          mkdir -p resources/bin
          for binary in ffmpeg ffprobe; do
            tool_path=$(command -v "$binary")
            ln -s "$tool_path" "resources/bin/$binary"
            "resources/bin/$binary" -version
          done
      - name: Verify headless Qt runtime
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c 'from PySide6.QtWidgets import QApplication; from PySide6.QtGui import QPixmap; app = QApplication([]); assert app.platformName() == "offscreen"; assert not QPixmap(2, 2).isNull(); print("Headless PySide6 QApplication and QPixmap loaded.")'
      - name: Full deterministic Python suite
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          test_root=$(mktemp -d "$RUNNER_TEMP/morgan-tests.XXXXXX")
          export MORGAN_DATA_DIR="$test_root/data"
          export MORGAN_LOG_DIR="$test_root/logs"
          export MORGAN_CACHE_DIR="$test_root/cache"
          python -m pytest -p no:cacheprovider
      - name: Cookie Companion JavaScript regression tests
        run: |
          node --version
          node --test companion/tests/core.test.mjs

  swift-tests:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python worker wheels
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: -r requirements.txt
          python -m pip check
      - name: Record hosted native toolchain
        shell: bash
        run: swift --version
      - name: Python and Swift contract drift check
        run: python scripts/check_backend_protocol.py
      - name: Relevant Python backend tests on macOS
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -p no:cacheprovider tests/test_backend_protocol.py tests/test_backend_service.py tests/test_backend_worker.py tests/test_backend_fixtures.py tests/test_swift_protocol_contract.py
      - name: Swift build
        working-directory: swift
        run: swift build
      - name: Swift unit, shared fixture and actual worker integration tests
        working-directory: swift
        shell: bash
        run: |
          set -euo pipefail
          export MORGAN_TEST_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          test_root=$(mktemp -d "$RUNNER_TEMP/morgan-swift-tests.XXXXXX")
          export MORGAN_DATA_DIR="$test_root/data"
          export MORGAN_LOG_DIR="$test_root/logs"
          export MORGAN_CACHE_DIR="$test_root/cache"
          swift test

  packaged-companion:
    name: Packaged runtime integration (not release qualification)
    needs: [python-tests, swift-tests]
    runs-on: macos-15
    timeout-minutes: 35
    env:
      MORGAN_PROVIDER_STAGE: ${{ runner.temp }}/morgan-provider-stage
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install packaging wheels and record hosted architecture
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt
          python -m pip check
          python -m PyInstaller --version
          test "$(uname -m)" = arm64
      - name: Build pinned provider and verified Node in an isolated stage
        run: |
          brew install pkgconf cairo pango
          python scripts/prepare_provider_bundle.py "$MORGAN_PROVIDER_STAGE"
          brew info --json=v2 cairo pango > "$MORGAN_PROVIDER_STAGE/licenses/canvas-build-formulae.json"
      - name: Build GUI bundle with separate console native host
        # This runs only on the hosted runner, never through the local build
        # script that would replace the user's existing dist installation.
        run: python -m PyInstaller --noconfirm --clean --workpath "$RUNNER_TEMP/morgan-companion-work" --distpath "$RUNNER_TEMP/morgan-companion-dist" MorganMediaDownloader.spec
      - name: Verify actual bundled native protocol and extension identity
        run: |
          python scripts/check_packaged_companion.py "$RUNNER_TEMP/morgan-companion-dist/Morgan Media Downloader.app"
          python scripts/check_packaged_provider.py "$RUNNER_TEMP/morgan-companion-dist/Morgan Media Downloader.app"
          codesign --verify --deep --strict "$RUNNER_TEMP/morgan-companion-dist/Morgan Media Downloader.app"
      # No upload, release, tag, installation or claim of media-tool/UI launch
      # qualification. Those gates must be added before release publication.
